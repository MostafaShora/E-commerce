@if (loading()) {
  <section class="mb-7 py-4">
    <div class="flex flex-col gap-4">
      <div class="h-7 w-48 animate-pulse rounded bg-slate-200"></div>
      <div class="flex gap-4 overflow-hidden">
        @for (item of [1, 2, 3, 4, 5, 6, 7, 8, 9]; track item) {
          <div class="flex min-w-[20%] max-w-[20%] shrink-0 flex-col items-center gap-3">
            <div class="h-20 w-20 animate-pulse rounded-xl bg-slate-200 sm:h-24 sm:w-24"></div>
            <div class="h-4 w-16 animate-pulse rounded bg-slate-200"></div>
          </div>
        }
      </div>
    </div>
  </section>
} @else if (errorMessage()) {
  <section class="rounded-xl border border-red-200 bg-red-50 px-4 py-5 text-sm text-red-700">
    <p>{{ errorMessage() }}</p>
    <button type="button" class="mt-2 font-semibold underline" (click)="loadCategories()">Retry</button>
  </section>
} @else if (categories().length > 0) {
  <section class="mb-7 py-4">
    <div class="flex flex-col gap-4">
      <h2 class="text-xl font-semibold text-slate-900">Shop by category</h2>

      <div
        class="flex gap-4 overflow-x-auto pb-2 [-ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
      >
        @for (category of categories(); track category._id) {
          <div
            class="min-w-[20%] max-w-[20%] shrink-0 sm:min-w-[16%] sm:max-w-[16%] md:min-w-[12%] md:max-w-[12%]"
          >
            <a
              [routerLink]="['/products']"
              [queryParams]="{ category: category._id }"
              class="flex w-full flex-col items-center gap-3 text-center"
            >
              <span
                class="flex size-20 items-center justify-center rounded-xl bg-slate-100 p-1 transition hover:bg-slate-200 sm:size-24"
              >
                <img
                  [src]="category.image?.url || ''"
                  [alt]="category.name"
                  class="size-full object-contain"
                />
              </span>
              <span class="line-clamp-2 text-sm font-medium leading-tight text-slate-700">
                {{ category.name }}
              </span>
            </a>
          </div>
        }
      </div>
    </div>
  </section>
}
