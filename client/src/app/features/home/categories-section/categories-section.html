@if (loading()) {
  <section class="mb-7 py-4">
    <div class="flex flex-col gap-5">
      <!-- Title Skeleton -->
      <div class="h-7 w-48 animate-pulse rounded bg-slate-200"></div>

      <!-- Categories Skeleton -->
      <div class="flex gap-4 overflow-hidden px-2">
        @for (item of [1, 2, 3, 4, 5, 6, 7, 8, 9]; track item) {
          <div
            class="flex shrink-0 basis-1/4 flex-col items-center gap-3 sm:basis-1/5 md:basis-[10.5%]"
          >
            <div class="size-20 animate-pulse rounded-xl bg-slate-200 sm:size-24"></div>

            <div class="h-4 w-16 animate-pulse rounded bg-slate-200"></div>
          </div>
        }
      </div>
    </div>
  </section>
} @else if (errorMessage()) {
  <section class="mb-7 rounded-xl border border-red-200 bg-red-50 px-4 py-5 text-sm text-red-700">
    <div class="flex items-center justify-between gap-3">
      <p>{{ errorMessage() }}</p>

      <button
        type="button"
        class="shrink-0 font-semibold underline hover:no-underline"
        (click)="loadCategories()"
      >
        Retry
      </button>
    </div>
  </section>
} @else if (categories().length > 0) {
  <section class="mb-7 py-4">
    <div class="flex flex-col gap-5">
      <!-- Header -->
      <h2 class="text-xl font-semibold tracking-tight text-slate-900">Shop by category</h2>

      <!-- Carousel Area -->
      <div class="relative min-w-0 px-5 sm:px-6">
        <!-- Previous -->
        <button
          type="button"
          aria-label="Previous categories"
          (click)="previous()"
          class="absolute left-0 top-1/2 z-20 flex size-10 -translate-y-1/2 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-700 shadow-lg transition-all duration-200 hover:bg-slate-50 hover:text-slate-950 hover:shadow-xl active:scale-90"
        >
          <svg lucideArrowLeft class="size-5 stroke-[2]"></svg>
        </button>

        <!-- Embla -->
        <div class="min-w-0 overflow-hidden" emblaCarousel [options]="emblaOptions">
          <div class="-ml-3 flex">
            @for (category of categories(); track category._id) {
              <div class="min-w-0 shrink-0 basis-1/4 pl-3 sm:basis-1/5 md:basis-[10.5%]">
                <a
                  [routerLink]="['/products']"
                  [queryParams]="{
                    category: category._id,
                  }"
                  class="group flex w-full flex-col items-center gap-3 text-center"
                >
                  <!-- Category Image -->
                  <span
                    class="flex size-20 items-center justify-center overflow-hidden rounded-xl bg-slate-50 p-1 transition-all duration-200 group-hover:bg-slate-100 group-hover:shadow-sm sm:size-24"
                  >
                    <img
                      [src]="category.image?.url || ''"
                      [alt]="category.name"
                      class="size-full object-contain transition-transform duration-200 group-hover:scale-105"
                    />
                  </span>

                  <!-- Category Name -->
                  <span
                    class="line-clamp-2 px-1 text-sm font-medium leading-tight text-slate-700 transition-colors group-hover:text-slate-950"
                  >
                    {{ category.name }}
                  </span>
                </a>
              </div>
            }
          </div>
        </div>

        <!-- Next -->
        <button
          type="button"
          aria-label="Next categories"
          (click)="next()"
          class="absolute right-0 top-1/2 z-20 flex size-10 -translate-y-1/2 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-700 shadow-lg transition-all duration-200 hover:bg-slate-50 hover:text-slate-950 hover:shadow-xl active:scale-90"
        >
          <svg lucideArrowRight class="size-5 stroke-[2]"></svg>
        </button>
      </div>
    </div>
  </section>
}
