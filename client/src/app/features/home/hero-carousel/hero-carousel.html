<section class="w-full py-6 sm:py-8" aria-label="Featured offers">
  <div
    class="relative isolate overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-[0_4px_18px_rgba(15,23,42,0.08)] transition-colors duration-300 dark:border-slate-800 dark:bg-slate-950 dark:shadow-[0_4px_24px_rgba(0,0,0,0.35)]"
  >
    @for (slide of heroSlides; track slide.id; let index = $index) {
      @if (activeSlide() === index) {
        <article class="relative min-h-[300px] sm:min-h-[320px] md:h-[330px]">
          <!-- Background image -->
          <img
            [src]="slide.image"
            alt=""
            class="absolute inset-0 h-full w-full object-cover object-center"
          />

          <!-- Light mode overlay -->
          <div
            class="absolute inset-0 bg-gradient-to-r from-white via-white/95 to-white/10 dark:hidden"
          ></div>

          <!-- Dark mode overlay -->
          <div
            class="absolute inset-0 hidden bg-gradient-to-r from-slate-950 via-slate-950/85 to-slate-950/20 dark:block"
          ></div>

          <!-- Content -->
          <div
            class="relative z-10 flex h-full min-h-[300px] w-full items-center px-6 py-8 sm:px-10 sm:py-10 md:min-h-0 md:max-w-[58%] md:px-10 lg:px-12"
          >
            <div class="flex max-w-xl flex-col items-start gap-4">
              <!-- Subtitle -->
              <p
                class="text-xs font-extrabold uppercase tracking-[0.16em] text-slate-700 transition-colors duration-300 dark:text-slate-300 sm:text-sm"
              >
                {{ slide.subtitle }}
              </p>

              <!-- Title -->
              <h1
                class="max-w-lg text-3xl font-extrabold leading-[1.05] tracking-[-0.035em] text-slate-950 transition-colors duration-300 dark:text-white sm:text-4xl md:text-[42px]"
              >
                {{ slide.title }}
              </h1>

              <!-- CTA -->
              <a
                routerLink="/products"
                class="inline-flex h-11 items-center justify-center rounded-full bg-white px-7 text-sm font-bold text-slate-950 shadow-[0_3px_12px_rgba(15,23,42,0.12)] ring-1 ring-slate-200 transition-all duration-200 hover:-translate-y-0.5 hover:bg-slate-50 hover:shadow-md active:translate-y-0 dark:bg-slate-900 dark:text-white dark:ring-slate-700 dark:shadow-[0_4px_16px_rgba(0,0,0,0.35)] dark:hover:bg-slate-800"
              >
                {{ slide.action }}
              </a>

              <!-- Note -->
              <p
                class="max-w-md text-xs leading-5 text-slate-600 transition-colors duration-300 dark:text-slate-300 sm:text-sm"
              >
                {{ slide.note }}
              </p>
            </div>
          </div>
        </article>
      }
    }

    <!-- Previous -->
    <button
      type="button"
      (click)="previous()"
      aria-label="Previous offer"
      class="absolute left-4 top-1/2 z-20 flex size-10 -translate-y-1/2 items-center justify-center rounded-full border border-slate-200 bg-white/95 text-slate-900 shadow-md backdrop-blur-sm transition-all duration-200 hover:scale-105 hover:bg-white hover:shadow-lg active:scale-95 dark:border-slate-700 dark:bg-slate-900/90 dark:text-white dark:hover:bg-slate-800 sm:left-5 sm:size-11"
    >
      <svg lucideChevronLeft class="size-5" [strokeWidth]="2" aria-hidden="true"></svg>
    </button>

    <!-- Next -->
    <button
      type="button"
      (click)="next()"
      aria-label="Next offer"
      class="absolute right-4 top-1/2 z-20 flex size-10 -translate-y-1/2 items-center justify-center rounded-full border border-slate-200 bg-white/95 text-slate-900 shadow-md backdrop-blur-sm transition-all duration-200 hover:scale-105 hover:bg-white hover:shadow-lg active:scale-95 dark:border-slate-700 dark:bg-slate-900/90 dark:text-white dark:hover:bg-slate-800 sm:right-5 sm:size-11"
    >
      <svg lucideChevronRight class="size-5" [strokeWidth]="2" aria-hidden="true"></svg>
    </button>

    <!-- Indicators -->
    <div
      class="absolute bottom-4 left-1/2 z-20 flex -translate-x-1/2 items-center gap-1.5 rounded-full bg-white/80 px-2.5 py-1.5 shadow-sm backdrop-blur-sm transition-colors duration-300 dark:bg-slate-900/80"
      role="tablist"
      aria-label="Offers"
    >
      @for (slide of heroSlides; track slide.id; let index = $index) {
        <button
          type="button"
          (click)="select(index)"
          [attr.aria-label]="'Show ' + slide.subtitle"
          [attr.aria-selected]="activeSlide() === index"
          class="h-1.5 rounded-full transition-all duration-300 dark:bg-slate-600"
          [class.w-6]="activeSlide() === index"
          [class.w-1.5]="activeSlide() !== index"
          [class.bg-slate-950]="activeSlide() === index"
          [class.bg-slate-300]="activeSlide() !== index"
          [class.dark:bg-white]="activeSlide() === index"
        ></button>
      }
    </div>
  </div>
</section>
