<div class="flex flex-col gap-6">
  <header>
    <h1 class="text-2xl font-semibold">Dashboard</h1>
    <p class="mt-1 text-sm text-slate-600">Overview of the current catalog and order volume.</p>
  </header>
  @if (error()) {
    <div class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700">
      <span>{{ error() }}</span
      ><button type="button" (click)="load()" class="ml-3 underline">Retry</button>
    </div>
  }
  @if (loading()) {
    <div class="grid gap-4 sm:grid-cols-2">
      <div class="h-32 animate-pulse rounded-xl bg-slate-200"></div>
      <div class="h-32 animate-pulse rounded-xl bg-slate-200"></div>
    </div>
  } @else {
    <div class="grid gap-4 sm:grid-cols-2">
      <a
        routerLink="/admin/products"
        class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm hover:border-slate-900"
        ><p class="text-sm text-slate-500">Products</p>
        <p class="mt-2 text-3xl font-semibold">{{ productTotal() }}</p>
        <p class="mt-2 text-sm text-slate-600">Manage catalog inventory</p></a
      ><a
        routerLink="/admin/orders"
        class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm hover:border-slate-900"
        ><p class="text-sm text-slate-500">Orders</p>
        <p class="mt-2 text-3xl font-semibold">{{ orderTotal() }}</p>
        <p class="mt-2 text-sm text-slate-600">Manage fulfillment status</p></a
      >
    </div>
  }
</div>
