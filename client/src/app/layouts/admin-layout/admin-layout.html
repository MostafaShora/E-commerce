<div class="flex min-h-screen w-full bg-slate-50 text-slate-900">
  <aside class="hidden w-64 shrink-0 border-r border-slate-200 bg-white md:flex md:flex-col">
    <div class="flex h-16 items-center border-b border-slate-200 px-5">
      <a routerLink="/admin" class="flex items-center gap-2 text-base font-semibold">
        <span>Nexora</span><span class="text-xs font-bold uppercase tracking-wider text-amber-600">Admin</span>
      </a>
    </div>
    <nav class="flex flex-1 flex-col gap-1 p-3">
      <a
        routerLink="/admin"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="bg-slate-900 text-white"
        class="shrink-0 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >Dashboard</a
      ><a
        routerLink="/admin/products"
        routerLinkActive="bg-slate-900 text-white"
        class="shrink-0 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >Products</a
      ><a
        routerLink="/admin/categories"
        routerLinkActive="bg-slate-900 text-white"
        class="shrink-0 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >Categories</a
      ><a
        routerLink="/admin/orders"
        routerLinkActive="bg-slate-900 text-white"
        class="shrink-0 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >Orders</a
      >
    </nav>
    <div class="border-t border-slate-200 p-3">
      <a routerLink="/" class="mb-2 flex rounded-lg bg-slate-800 px-3 py-2.5 text-sm font-medium text-white">&larr; Storefront</a>
      <button type="button" (click)="logout()" class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium text-red-600 hover:bg-red-50">Log out</button>
    </div>
  </aside>
  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-16 items-center justify-between border-b border-slate-200 bg-white px-4 sm:px-6">
      <div><h1 class="text-lg font-semibold">Admin Portal</h1><p class="hidden text-xs text-slate-500 sm:block">Store management</p></div>
      @if (auth.currentUser(); as user) {
        <div class="text-right text-xs"><p class="font-semibold">{{ user.name }}</p><p class="text-slate-500">{{ user.email }}</p></div>
      }
    </header>
    <nav class="flex gap-2 overflow-x-auto border-b border-slate-200 bg-white px-4 py-2 md:hidden">
      <a routerLink="/admin" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="bg-slate-900 text-white" class="shrink-0 rounded-lg px-3 py-2 text-sm font-medium text-slate-600">Dashboard</a>
      <a routerLink="/admin/products" routerLinkActive="bg-slate-900 text-white" class="shrink-0 rounded-lg px-3 py-2 text-sm font-medium text-slate-600">Products</a>
      <a routerLink="/admin/categories" routerLinkActive="bg-slate-900 text-white" class="shrink-0 rounded-lg px-3 py-2 text-sm font-medium text-slate-600">Categories</a>
      <a routerLink="/admin/orders" routerLinkActive="bg-slate-900 text-white" class="shrink-0 rounded-lg px-3 py-2 text-sm font-medium text-slate-600">Orders</a>
    </nav>
    <main class="mx-auto w-full max-w-275 flex-1 overflow-y-auto p-4 sm:p-6"><router-outlet></router-outlet></main>
  </div>
</div>
