<header class="sticky top-0 z-40 border-b border-slate-200 bg-white">
  <div class="mx-auto flex h-16 w-full max-w-7xl items-center gap-4 px-4">
    <app-logo className="shrink-0 lg:mr-6" />
    <form [formGroup]="searchForm" (ngSubmit)="submitSearch()" class="min-w-0 flex-1">
      <div class="flex rounded-full border border-slate-300 bg-white px-3 py-1">
        <input class="min-w-0 flex-1 bg-transparent px-2 py-2 text-sm outline-none" formControlName="query" type="search" placeholder="Search products, and recipes" aria-label="Search products" />
        <button type="submit" class="px-2 text-sm font-medium text-slate-700">Search</button>
      </div>
    </form>
    <app-mode-toggle />
    @if (auth.currentUser(); as user) {
      <details class="relative hidden sm:block">
        <summary class="flex cursor-pointer list-none items-center gap-2 rounded-lg px-2 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100">
          <app-avatar [src]="user.avatar" [alt]="user.name" [fallback]="user.name.charAt(0).toUpperCase()" />
          {{ user.name }}
        </summary>
        <div class="absolute right-0 z-50 mt-2 w-56 rounded-lg border border-slate-200 bg-white p-2 text-sm shadow-lg">
          <p class="px-3 py-2 text-xs text-slate-500">{{ user.email }}</p>
          <a routerLink="/account/orders" class="block rounded px-3 py-2 hover:bg-slate-100">Order history</a>
          <a routerLink="/account/addresses" class="block rounded px-3 py-2 hover:bg-slate-100">Addresses</a>
          <a routerLink="/account/reviews" class="block rounded px-3 py-2 hover:bg-slate-100">Ratings &amp; reviews</a>
          @if (user.isAdmin) { <a routerLink="/admin" class="block rounded px-3 py-2 hover:bg-slate-100">Admin portal</a> }
          <button type="button" (click)="logout()" class="w-full rounded px-3 py-2 text-left text-red-600 hover:bg-red-50">Logout</button>
        </div>
      </details>
    } @else {
      <button type="button" class="hidden text-sm font-medium text-slate-700 sm:block" (click)="openAuth()">Sign in / Register</button>
    }
    <app-cart-button />
  </div>
</header>
