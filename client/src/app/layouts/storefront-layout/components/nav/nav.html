<header class="sticky top-0 z-40 border-b border-slate-200 bg-white">
  <div class="mx-auto flex h-16 w-full max-w-7xl items-center gap-4 px-4">

    <!-- Logo -->
    <app-logo class="shrink-0 lg:me-6" />

    <!-- Search -->
    <form
      [formGroup]="searchForm"
      (ngSubmit)="submitSearch()"
      class="hidden min-w-0 flex-1 sm:block"
    >
      <div class="flex rounded-full border border-slate-300 bg-white px-3 py-1">

        <input
          class="min-w-0 flex-1 bg-transparent px-2 py-2 text-sm outline-none"
          formControlName="query"
          type="search"
          dir="auto"
          [placeholder]="language.t('nav.search.placeholder')"
          [attr.aria-label]="language.t('nav.search.label')"
        />

        <button
          type="submit"
          class="flex items-center gap-1 px-2 text-sm font-medium text-slate-700"
          [attr.aria-label]="language.t('nav.search.label')"
        >
          <svg lucideSearch class="size-[18px]"></svg>
          <span class="hidden sm:inline">{{ language.t('nav.search.label') }}</span>
        </button>

      </div>
    </form>

    <!-- Right side -->
    <div class="ms-auto flex shrink-0 items-center gap-3">

      <!-- Dark / Light Mode -->
      <app-mode-toggle />

      <button
        type="button"
        (click)="switchLanguage()"
        class="flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-700 transition hover:bg-slate-50"
        [attr.aria-label]="language.language() === 'ar' ? 'Switch to English' : 'Switch to Arabic'"
      >
        <span>{{ language.language() === 'ar' ? 'EN' : 'AR' }}</span>
      </button>

      <!-- Account -->
      @if (auth.currentUser(); as user) {

        <details #accountMenu class="relative">

          <!-- Account Button -->
          <summary
            class="flex cursor-pointer list-none items-center gap-2 rounded-lg px-2 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
          >

            <app-avatar
              [src]="user.avatar"
              [alt]="user.name"
              [fallback]="user.name.charAt(0).toUpperCase()"
            />

            <span class="hidden sm:inline">
              {{ user.name }}
            </span>

          </summary>

          <!-- Dropdown Menu -->
          <div
            class="absolute end-0 top-full z-[9999] mt-2 w-56 overflow-hidden rounded-xl border border-slate-200 bg-white p-2 text-sm shadow-xl"
          >

            <!-- User Info -->
            <div class="border-b border-slate-100 px-3 py-3">

              <p class="font-medium text-slate-900">
                {{ user.name }}
              </p>

              <p class="mt-1 truncate text-xs text-slate-500">
                {{ user.email }}
              </p>

            </div>

            <!-- Menu Links -->
            <div class="py-1">

              <a
                routerLink="/account/orders"
                class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-700 transition hover:bg-slate-100"
              >
                <span>{{ language.t('nav.account.orderHistory') }}</span>
              </a>

              <a
                routerLink="/account/addresses"
                class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-700 transition hover:bg-slate-100"
              >
                <span>{{ language.t('nav.account.addresses') }}</span>
              </a>

              <a
                routerLink="/account/reviews"
                class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-700 transition hover:bg-slate-100"
              >
                <span>{{ language.t('nav.account.reviews') }}</span>
              </a>

              <!-- Admin -->
              @if (user.isAdmin) {

                <a
                  routerLink="/admin"
                  class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-700 transition hover:bg-slate-100"
                >
                  <span>{{ language.t('nav.account.adminPortal') }}</span>
                </a>

              }

            </div>

            <!-- Logout -->
            <div class="border-t border-slate-100 pt-1">

              <button
                type="button"
                (click)="logout()"
                class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-start text-red-600 transition hover:bg-red-50"
              >
                <svg lucideLogOut class="size-[18px]"></svg>

                <span>{{ language.t('nav.account.logout') }}</span>
              </button>

            </div>

          </div>

        </details>

      } @else {

        <!-- Sign In / Register -->
        <button
          type="button"
          class="flex shrink-0 items-center gap-2 rounded-lg px-2 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
          (click)="openAuth()"
          [attr.aria-label]="language.t('nav.account.signIn')"
        >

          <svg lucideUser class="size-[18px]"></svg>

          <span class="hidden sm:inline">
            {{ language.t('nav.account.signIn') }}
          </span>

        </button>

      }

      <!-- Cart -->
      <app-cart-button />

    </div>

  </div>
</header>
