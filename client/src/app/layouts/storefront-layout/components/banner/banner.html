@if (isVisible()) {
  <div class="promo-banner">
    <div
      #tickerViewport
      class="promo-banner__ticker"
      aria-label="Free delivery on orders above $20. Farm-fresh produce delivered daily."
    >
      <div class="promo-banner__characters" aria-hidden="true">
        @for (char of tickerCharacters; track $index) {
          <span
            #tickerCharacter
            class="promo-banner__character"
          >{{ char === ' ' ? '\u00A0' : char }}</span>
        }
      </div>
    </div>

    <button
      type="button"
      class="promo-banner__close"
      (click)="dismiss()"
      aria-label="Dismiss promotion banner"
    >
      <svg lucideX class="size-[18px]"></svg>
    </button>
  </div>
}
