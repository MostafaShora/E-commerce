@if (isVisible()) {
  <div class="relative flex min-h-9 w-full items-center justify-center bg-slate-900 px-10 text-white">
    <div class="flex flex-wrap items-center justify-center gap-x-8 gap-y-1 text-xs font-semibold sm:text-sm">
      <span>Free delivery on orders above $20</span>
      <span class="hidden h-5 w-px bg-white/40 sm:block"></span>
      <span>Farm-fresh produce delivered daily</span>
    </div>
    <button type="button" class="absolute right-3 top-1/2 grid size-7 -translate-y-1/2 place-items-center rounded-md text-white/90 hover:bg-white/15" (click)="dismiss()" aria-label="Dismiss promotion banner">x</button>
  </div>
}
