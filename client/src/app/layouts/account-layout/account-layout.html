<div class="w-full overflow-x-hidden">
  <div
    class="mx-auto grid min-h-[calc(100vh-8rem)] w-full max-w-7xl min-w-0 gap-6 px-4 py-6 sm:px-6 lg:grid-cols-[240px_minmax(0,1fr)] lg:gap-10 lg:px-8 lg:py-8"
  >
    <!-- Sidebar -->
    <aside class="min-w-0 max-w-full border-slate-200 dark:border-slate-800 lg:border-r lg:pr-6">
      <div class="flex min-w-0 max-w-full flex-col gap-2 lg:sticky lg:top-24">
        <!-- Back -->
        <button
          type="button"
          class="group flex w-fit max-w-full items-center gap-2 px-0 py-1 text-sm font-medium text-slate-700 transition-colors duration-200 hover:text-slate-950 dark:text-slate-300 dark:hover:text-white"
          (click)="back()"
          aria-label="Go back"
        >
          <svg
            lucideArrowLeft
            class="size-4 shrink-0 transition-transform duration-200 group-hover:-translate-x-0.5"
            [strokeWidth]="2"
            aria-hidden="true"
          ></svg>

          <span>Back</span>
        </button>

        <!-- Divider -->
        <div class="my-2 h-px w-full shrink-0 bg-slate-200 dark:bg-slate-800"></div>

        <!-- Navigation -->
        <nav
          class="flex min-w-0 max-w-full gap-2 overflow-x-auto overscroll-x-contain pb-1 lg:flex-col lg:gap-1.5 lg:overflow-visible lg:pb-0"
          aria-label="Account navigation"
        >
          <!-- Account -->
          <a
            routerLink="/account"
            routerLinkActive="!bg-slate-900 !text-white shadow-sm dark:!bg-slate-100 dark:!text-slate-950"
            [routerLinkActiveOptions]="{ exact: true }"
            class="group flex shrink-0 items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 transition-all duration-200 hover:bg-slate-100 hover:text-slate-950 lg:w-full lg:min-w-0 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
          >
            <svg
              lucideUserRound
              class="size-[18px] shrink-0 transition-transform duration-200 group-hover:scale-105"
              [strokeWidth]="2"
              aria-hidden="true"
            ></svg>

            <span>Account</span>
          </a>

          <!-- Order History -->
          <a
            routerLink="/account/orders"
            routerLinkActive="!bg-slate-900 !text-white shadow-sm dark:!bg-slate-100 dark:!text-slate-950"
            [routerLinkActiveOptions]="{ exact: true }"
            class="group flex shrink-0 items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 transition-all duration-200 hover:bg-slate-100 hover:text-slate-950 lg:w-full lg:min-w-0 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
          >
            <svg
              lucideClipboardList
              class="size-[18px] shrink-0 transition-transform duration-200 group-hover:scale-105"
              [strokeWidth]="2"
              aria-hidden="true"
            ></svg>

            <span>Order history</span>
          </a>

          <!-- Reviews -->
          <a
            routerLink="/account/reviews"
            routerLinkActive="!bg-slate-900 !text-white shadow-sm dark:!bg-slate-100 dark:!text-slate-950"
            class="group flex shrink-0 items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 transition-all duration-200 hover:bg-slate-100 hover:text-slate-950 lg:w-full lg:min-w-0 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
          >
            <svg
              lucideStar
              class="size-[18px] shrink-0 transition-transform duration-200 group-hover:scale-105"
              [strokeWidth]="2"
              aria-hidden="true"
            ></svg>

            <span>Ratings &amp; reviews</span>
          </a>

          <!-- Addresses -->
          <a
            routerLink="/account/addresses"
            routerLinkActive="!bg-slate-900 !text-white shadow-sm dark:!bg-slate-100 dark:!text-slate-950"
            class="group flex shrink-0 items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 transition-all duration-200 hover:bg-slate-100 hover:text-slate-950 lg:w-full lg:min-w-0 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
          >
            <svg
              lucideMapPin
              class="size-[18px] shrink-0 transition-transform duration-200 group-hover:scale-105"
              [strokeWidth]="2"
              aria-hidden="true"
            ></svg>

            <span>Addresses</span>
          </a>
        </nav>

        <!-- Logout divider -->
        <div class="my-3 hidden h-px w-full bg-slate-200 dark:bg-slate-800 lg:block"></div>

        <!-- Logout -->
        <button
          type="button"
          (click)="logout()"
          class="group hidden w-full items-center justify-start gap-2 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-500 transition-all duration-200 hover:bg-red-50 hover:text-red-700 lg:flex dark:text-slate-400 dark:hover:bg-red-950/30 dark:hover:text-red-400"
          aria-label="Log out"
        >
          <svg
            lucideLogOut
            class="size-[18px] shrink-0 transition-transform duration-200 group-hover:translate-x-0.5"
            [strokeWidth]="2"
            aria-hidden="true"
          ></svg>

          <span>Log out</span>
        </button> 
      </div>
    </aside>

    <!-- Content -->
    <section class="min-w-0 max-w-full">
      <div class="w-full min-w-0 max-w-5xl">
        <router-outlet></router-outlet>
      </div>
    </section>
  </div>
</div>
