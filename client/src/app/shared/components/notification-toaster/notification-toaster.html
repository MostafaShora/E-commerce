<div class="pointer-events-none fixed right-4 top-4 z-100 flex w-[min(22rem,calc(100vw-2rem))] flex-col gap-2" aria-live="polite">
  @for (notification of notificationService.notifications(); track notification.id) {
    <div
      class="pointer-events-auto flex items-start justify-between gap-3 rounded-lg border bg-white px-4 py-3 text-sm shadow-lg"
      [class.border-emerald-200]="notification.kind === 'success'"
      [class.text-emerald-800]="notification.kind === 'success'"
      [class.border-red-200]="notification.kind === 'error'"
      [class.text-red-800]="notification.kind === 'error'"
      [class.border-slate-200]="notification.kind === 'info'"
      [class.text-slate-800]="notification.kind === 'info'"
    >
      <span>{{ notification.message }}</span>
      <button
        type="button"
        class="shrink-0 font-semibold opacity-70 hover:opacity-100"
        (click)="notificationService.dismiss(notification.id)"
        aria-label="Dismiss notification"
      >
        x
      </button>
    </div>
  }
</div>
