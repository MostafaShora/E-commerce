<div
  class="inline-flex min-w-0 items-center gap-1.5 text-sm"
  role="img"
  [attr.aria-label]="accessibleLabel()"
>
  <span class="inline-flex shrink-0 items-center" aria-hidden="true">
    @for (fill of starFillPercentages(); track $index) {
      <span class="relative block size-4 shrink-0">
        <svg
          lucideStar
          class="rating-star-outline absolute inset-0 size-4 fill-none text-slate-400"
        ></svg>
        <span
          class="rating-star-fill absolute inset-y-0 left-0 overflow-hidden"
          [style.width.%]="fill"
        >
          <svg lucideStar class="block size-4 fill-current text-amber-500"></svg>
        </span>
      </span>
    }
  </span>
  @if (hasRating()) {
    <span class="whitespace-nowrap text-slate-600">{{ ratingText() }}</span>
  }
  <span class="whitespace-nowrap text-slate-500">({{ safeReviewCount() }})</span>
</div>
