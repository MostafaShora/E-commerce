<details class="relative">
  <summary class="grid size-9 cursor-pointer list-none place-items-center rounded-lg border border-slate-300 text-sm hover:bg-slate-100" aria-label="Choose theme">
    {{ theme.isDark() ? '☾' : '☀' }}
  </summary>
  <div class="absolute right-0 z-50 mt-2 w-32 rounded-lg border border-slate-200 bg-white p-1 text-sm shadow-lg">
    <button type="button" class="block w-full rounded px-3 py-2 text-left hover:bg-slate-100" (click)="theme.setTheme('light')">Light</button>
    <button type="button" class="block w-full rounded px-3 py-2 text-left hover:bg-slate-100" (click)="theme.setTheme('dark')">Dark</button>
    <button type="button" class="block w-full rounded px-3 py-2 text-left hover:bg-slate-100" (click)="theme.setTheme('system')">System</button>
  </div>
</details>
