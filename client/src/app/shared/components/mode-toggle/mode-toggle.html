<details #themeMenu class="relative">
  <summary
    class="grid size-9 cursor-pointer list-none place-items-center rounded-lg border border-slate-300 hover:bg-slate-100"
    aria-label="Choose theme"
  >
    @if (theme.isDark()) {
      <svg lucideMoon class="size-[18px]"></svg>
    } @else {
      <svg lucideSun class="size-[18px]"></svg>
    }
  </summary>
  <div
    class="absolute right-0 z-50 mt-2 w-32 rounded-lg border border-slate-200 bg-white p-1 text-sm shadow-lg"
  >
    <button
      type="button"
      class="block w-full rounded px-3 py-2 text-left hover:bg-slate-100"
      [attr.aria-pressed]="theme.mode() === 'light'"
      [class.bg-slate-100]="theme.mode() === 'light'"
      (click)="selectTheme('light')"
    >
      Light
    </button>
    <button
      type="button"
      class="block w-full rounded px-3 py-2 text-left hover:bg-slate-100"
      [attr.aria-pressed]="theme.mode() === 'dark'"
      [class.bg-slate-100]="theme.mode() === 'dark'"
      (click)="selectTheme('dark')"
    >
      Dark
    </button>
    <button
      type="button"
      class="block w-full rounded px-3 py-2 text-left hover:bg-slate-100"
      [attr.aria-pressed]="theme.mode() === 'system'"
      [class.bg-slate-100]="theme.mode() === 'system'"
      (click)="selectTheme('system')"
    >
      System
    </button>
  </div>
</details>
