<details #themeMenu class="relative">
  <summary
    class="grid size-9 cursor-pointer list-none place-items-center rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800"
    [attr.aria-label]="language.t('common.chooseTheme')"
  >
    @if (theme.isDark()) {
      <svg lucideMoon class="size-[18px]"></svg>
    } @else {
      <svg lucideSun class="size-[18px]"></svg>
    }
  </summary>
  <div
    class="absolute end-0 z-50 mt-2 w-32 rounded-lg border border-slate-200 bg-white p-1 text-sm text-slate-700 shadow-lg dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200"
  >
    <button
      type="button"
      class="block w-full rounded px-3 py-2 text-start hover:bg-slate-100 dark:hover:bg-slate-800"
      [attr.aria-pressed]="theme.mode() === 'light'"
      [style.background-color]="theme.mode() === 'light' ? 'var(--muted)' : null"
      (click)="selectTheme('light')"
    >
      {{ language.t('common.light') }}
    </button>
    <button
      type="button"
      class="block w-full rounded px-3 py-2 text-start hover:bg-slate-100 dark:hover:bg-slate-800"
      [attr.aria-pressed]="theme.mode() === 'dark'"
      [style.background-color]="theme.mode() === 'dark' ? 'var(--muted)' : null"
      (click)="selectTheme('dark')"
    >
      {{ language.t('common.dark') }}
    </button>
    <button
      type="button"
      class="block w-full rounded px-3 py-2 text-start hover:bg-slate-100 dark:hover:bg-slate-800"
      [attr.aria-pressed]="theme.mode() === 'system'"
      [class.bg-slate-100]="theme.mode() === 'system'"
      (click)="selectTheme('system')"
    >
      {{ language.t('common.system') }}
    </button>
  </div>
</details>
