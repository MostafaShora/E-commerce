@if (open) {
  <div class="fixed inset-0 z-60 grid place-items-center bg-slate-950/40 px-4" (click)="outsideClick()">
    <section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl" role="dialog" aria-modal="true" [attr.aria-label]="title" (click)="$event.stopPropagation()">
      <header class="flex items-start justify-between gap-4">
        @if (title) { <h2 class="text-xl font-semibold text-slate-900">{{ title }}</h2> }
        <button type="button" class="ml-auto grid size-9 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" (click)="close()" aria-label="Close dialog">
          <mat-icon>close</mat-icon>
        </button>
      </header>
      <div class="mt-4"><ng-content /></div>
    </section>
  </div>
}
