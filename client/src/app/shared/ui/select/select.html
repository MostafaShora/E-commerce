<select [value]="value" [attr.aria-label]="ariaLabel" (change)="change($any($event.target).value)" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900">
  @for (option of options; track option.value) {
    <option [value]="option.value">{{ option.label }}</option>
  }
</select>
