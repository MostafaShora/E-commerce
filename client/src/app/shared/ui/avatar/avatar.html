<span class="grid size-9 shrink-0 place-items-center overflow-hidden rounded-full bg-slate-200 text-sm font-semibold text-slate-700" role="img" [attr.aria-label]="src && !imageFailed() ? alt : fallback">
  @if (src && !imageFailed()) {
    <img [src]="src" [alt]="alt" class="size-full object-cover" (error)="handleError()" />
  } @else {
    <span aria-hidden="true">{{ fallback }}</span>
  }
</span>
